name: "Dispatch Copilot PR Verification"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional single Copilot PR number to verify
        type: string
        default: ""
      dispatch_run_id:
        description: Optional explicit Copilot dispatch run ID for the current campaign
        type: string
        default: ""
      force:
        description: Dispatch even if the PR already has a REACHABLE verification label
        type: boolean
        default: false
  # Event-driven, not polled: fires when a Copilot campaign workflow actually
  # completes, instead of an unconditional schedule that ran every 15
  # minutes around the clock regardless of whether any remediation was in
  # progress. All four are workflow_dispatch-only (a campaign is always a
  # deliberate, manual dispatch, never automatic), so this is the exact
  # moment a campaign becomes available to verify.
  workflow_run:
    workflows:
      - "Run Demo (Copilot Dispatch)"
      - "Run Demo (Copilot E2E)"
      - "Run Demo (Copilot Alpha Candidate)"
      - "Run Demo (Copilot Bundle Replay)"
    types:
      - completed

concurrency:
  group: reachable-copilot-verification-dispatcher-main
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  dispatch-copilot-pr-verification:
    # Only act on a workflow_run event when the campaign it names actually
    # succeeded; workflow_dispatch (manual/explicit) always proceeds.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      FORCE_DISPATCH: ${{ inputs.force || false }}
      PR_NUMBER: ${{ inputs.pr_number || '' }}
      DISPATCH_RUN_ID_INPUT: ${{ inputs.dispatch_run_id || '' }}
      REQUESTED_LABEL: reachable-verification-requested
      VERIFIED_LABEL: reachable-copilot-verified
      FAILED_LABEL: reachable-copilot-verification-failed
    steps:
      - name: Resolve and dispatch Copilot PR verification
        run: |
          set -euo pipefail
          dispatch_count=0
          max_dispatches=25
          current_campaign_max_age_hours=6
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            max_dispatches=3
          fi

          add_issue_label() {
            local pr_number="$1"
            local label_name="$2"
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/issues/${pr_number}/labels" \
              -f "labels[]=${label_name}" >/dev/null
          }

          remove_issue_label() {
            local pr_number="$1"
            local label_name="$2"
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/issues/${pr_number}/labels/${label_name}" >/dev/null 2>&1 || true
          }

          gh label create "$REQUESTED_LABEL" \
            --repo "$GITHUB_REPOSITORY" \
            --color 0969da \
            --description "REACHABLE verification was dispatched for this Copilot PR" >/dev/null 2>&1 || true
          gh label create "$VERIFIED_LABEL" \
            --repo "$GITHUB_REPOSITORY" \
            --color 2da44e \
            --description "REACHABLE verified this Copilot PR" >/dev/null 2>&1 || true
          gh label create "$FAILED_LABEL" \
            --repo "$GITHUB_REPOSITORY" \
            --color cf222e \
            --description "REACHABLE could not verify this Copilot PR" >/dev/null 2>&1 || true

          resolve_and_download_campaign() {
            local run_id=""
            local campaign_dir=""
            if [ -n "${DISPATCH_RUN_ID_INPUT}" ]; then
              run_id="${DISPATCH_RUN_ID_INPUT}"
              campaign_dir="$(mktemp -d)"
              if gh run download "${run_id}" \
                --repo "$GITHUB_REPOSITORY" \
                --name reachable-ci-artifacts \
                --dir "$campaign_dir" >/dev/null 2>&1; then
                local db
                db="$(find "$campaign_dir" -name copilot-tasks.repo.db -type f | head -n 1 || true)"
                if [ -n "$db" ]; then
                  printf '%s\t%s\t%s\n' "$run_id" "$campaign_dir" "$db"
                  return 0
                fi
              fi
              echo "Explicit dispatch_run_id ${run_id} is not usable: reachable-ci-artifacts/copilot-tasks.repo.db not found." >&2
              return 1
            fi

            recent_run_ids="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 80 \
              --json databaseId,workflowName,status,conclusion,headBranch,createdAt)"
            while IFS= read -r run_id; do
              [ -n "$run_id" ] || continue
              campaign_dir="$(mktemp -d)"
              if ! gh run download "${run_id}" \
                --repo "$GITHUB_REPOSITORY" \
                --name reachable-ci-artifacts \
                --dir "$campaign_dir" >/dev/null 2>&1; then
                rm -rf "$campaign_dir"
                continue
              fi
              db="$(find "$campaign_dir" -name copilot-tasks.repo.db -type f | head -n 1 || true)"
              if [ -n "$db" ]; then
                printf '%s\t%s\t%s\n' "$run_id" "$campaign_dir" "$db"
                return 0
              fi
              rm -rf "$campaign_dir"
            done < <(
              python3 - <<'PY' "$recent_run_ids" "$current_campaign_max_age_hours"
          import json
          import sys
          from datetime import datetime, timedelta, timezone

          payload = json.loads(sys.argv[1])
          max_age_hours = int(sys.argv[2])
          cutoff = datetime.now(timezone.utc) - timedelta(hours=max_age_hours)
          allowed = {
              "Run Demo (Copilot Dispatch)",
              "Run Demo (Copilot E2E)",
              "Run Demo (Copilot Alpha Candidate)",
              "Run Demo (Copilot Bundle Replay)",
          }
          for item in payload:
              if item.get("workflowName") not in allowed:
                  continue
              if item.get("status") != "completed" or item.get("conclusion") != "success":
                  continue
              if item.get("headBranch") != "main":
                  continue
              created_at = item.get("createdAt")
              if not created_at:
                  continue
              created = datetime.fromisoformat(created_at.replace("Z", "+00:00"))
              if created < cutoff:
                  continue
              print(item["databaseId"])
          PY
            )
            return 1
          }

          campaign_meta="$(resolve_and_download_campaign || true)"
          if [ -z "$campaign_meta" ]; then
            echo "No downloadable Copilot campaign artifact is available. Nothing to verify for the current batch."
            exit 0
          fi
          IFS=$'\t' read -r DISPATCH_RUN_ID campaign_dir campaign_db <<< "$campaign_meta"
          echo "Using Copilot dispatch run ${DISPATCH_RUN_ID} as the current campaign anchor."

          pr_json_path="$(mktemp)"
          if [ -n "${PR_NUMBER}" ]; then
            gh pr view "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json number,author,headRefName,labels,state,updatedAt > "$pr_json_path"
          else
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --json number,author,headRefName,labels,state,updatedAt > "$pr_json_path"
          fi

          python3 - "$campaign_db" "$pr_json_path" "$REQUESTED_LABEL" "$VERIFIED_LABEL" "$FAILED_LABEL" "$FORCE_DISPATCH" "$PR_NUMBER" <<'PY' > copilot-prs.tsv
          import json
          import sqlite3
          import sys

          db_path, pr_path, requested, verified, failed, force_raw, single_pr = sys.argv[1:]
          force = str(force_raw).lower() == "true"
          requested_number = int(single_pr) if single_pr.strip() else None
          prs_raw = json.load(open(pr_path, encoding="utf-8"))
          prs = prs_raw if isinstance(prs_raw, list) else [prs_raw]

          conn = sqlite3.connect(db_path)
          conn.row_factory = sqlite3.Row
          try:
              task_rows = list(
                  conn.execute(
                      """
                      SELECT task_id, base_ref, head_ref, state, verification_status, pr_number, pr_url
                      FROM copilot_tasks
                      ORDER BY rowid ASC
                      """
                  )
              )
          finally:
              conn.close()

          active_suffixes = {}
          for row in task_rows:
              task_id = str(row["task_id"] or "").strip()
              if not task_id:
                  continue
              suffix = task_id.removeprefix("rch_task_")
              active_suffixes[suffix] = {
                  "task_id": task_id,
                  "verification_status": str(row["verification_status"] or ""),
                  "base_ref": str(row["base_ref"] or ""),
                  "pr_number": row["pr_number"],
              }

          best_by_suffix = {}
          for pr in prs:
              labels = {item.get("name") for item in pr.get("labels", []) if isinstance(item, dict)}
              number = pr.get("number")
              if requested_number is not None and number != requested_number:
                  continue
              author = ((pr.get("author") or {}).get("login") or "")
              head = str(pr.get("headRefName") or "")
              state = str(pr.get("state") or "")
              updated_at = str(pr.get("updatedAt") or "")
              if state and state.upper() != "OPEN":
                  continue
              if author != "app/copilot-swe-agent":
                  continue
              if not head.startswith("copilot/rch-task-"):
                  continue
              matched_suffix = None
              for suffix in active_suffixes:
                  if head.startswith(f"copilot/rch-task-{suffix}"):
                      matched_suffix = suffix
                      break
              if matched_suffix is None:
                  continue
              task = active_suffixes[matched_suffix]
              if str(task.get("verification_status") or "") == "verified" and not force:
                  continue
              if not force and (requested in labels or verified in labels or failed in labels):
                  continue
              current = best_by_suffix.get(matched_suffix)
              candidate = {
                  "number": number,
                  "head": head,
                  "suffix": matched_suffix,
                  "task_id": task["task_id"],
                  "base_ref": task["base_ref"],
                  "updated_at": updated_at,
              }
              if current is None or candidate["updated_at"] > current["updated_at"]:
                  best_by_suffix[matched_suffix] = candidate

          for suffix, item in best_by_suffix.items():
              print(f"{item['number']}\t{item['head']}\t{item['suffix']}\t{item['task_id']}\t{item['base_ref']}")
          PY

          if [ ! -s copilot-prs.tsv ]; then
            echo "No Copilot PRs from the current campaign need REACHABLE verification dispatch."
            exit 0
          fi

          already_verified() {
            local pr_number="$1"
            local run_id
            while IFS= read -r run_id; do
              [ -n "$run_id" ] || continue
              rm -rf verify-artifacts
              mkdir -p verify-artifacts
              if ! gh run download "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --name reachable-copilot-pr-verification \
                --dir verify-artifacts >/dev/null 2>&1; then
                continue
              fi
              summary_json="$(find verify-artifacts -path '*/release-proof/summary.json' -type f | head -n 1 || true)"
              verify_json="$(find verify-artifacts -name copilot-verify-pr.json -type f | head -n 1 || true)"
              if [ -z "$summary_json" ] || [ -z "$verify_json" ]; then
                continue
              fi
              if python3 - "$summary_json" "$verify_json" "$pr_number" <<'PY'
          import json
          import sys
          from pathlib import Path

          summary_path, verify_path, pr_number = sys.argv[1:]
          summary = json.loads(Path(summary_path).read_text(encoding="utf-8"))
          if not str(summary.get("pull_request_url") or "").rstrip("/").endswith(f"/pull/{pr_number}"):
              raise SystemExit(1)
          raw = Path(verify_path).read_text(encoding="utf-8")
          decoder = json.JSONDecoder()
          for index, char in enumerate(raw):
              if char != "{":
                  continue
              try:
                  payload, _ = decoder.raw_decode(raw[index:])
              except json.JSONDecodeError:
                  continue
              if payload.get("result") == "verified":
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
              then
                echo "PR #${pr_number} already has a successful REACHABLE verification artifact from run ${run_id}."
                return 0
              fi
            done < <(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "Verify Copilot PR" \
                --limit 40 \
                --json databaseId,event,status,conclusion \
                --jq '.[] | select(.event == "workflow_dispatch" and .status == "completed" and .conclusion == "success") | .databaseId'
            )
            return 1
          }

          while IFS=$'\t' read -r pr_number _head_ref _task_suffix task_id base_ref; do
            [ -n "$pr_number" ] || continue
            if [ "${FORCE_DISPATCH}" != "true" ] && already_verified "$pr_number"; then
              continue
            fi
            dispatch_run_id="${DISPATCH_RUN_ID}"
            echo "Dispatching REACHABLE Copilot verification for PR #${pr_number} from campaign task ${task_id} on base ${base_ref:-main} using dispatch run ${dispatch_run_id}."
            add_issue_label "$pr_number" "$REQUESTED_LABEL"
            if ! gh workflow run reachable-copilot-pr-verify.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f "pr_number=${pr_number}" \
              -f "dispatch_run_id=${dispatch_run_id}"; then
              remove_issue_label "$pr_number" "$REQUESTED_LABEL"
              add_issue_label "$pr_number" "$FAILED_LABEL" || true
              exit 1
            fi
            remove_issue_label "$pr_number" "$FAILED_LABEL"
            dispatch_count=$((dispatch_count + 1))
            if [ "$dispatch_count" -ge "$max_dispatches" ]; then
              echo "Reached dispatch limit (${max_dispatches}) for this run."
              break
            fi
          done < copilot-prs.tsv
