# Public demo subset only. Keep this workflow-security fixture small and
# customer-facing; the full subclass corpus and remediation experiment matrix
# belong outside reach-testbed-github-go.
name: REACHABLE Cordyceps workflow-security fixture

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["REACHABLE Cordyceps workflow-security fixture"]
    types: [completed]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  cordyceps-command-injection:
    # Scanner fixture only. Keep disabled while preserving the low-trust
    # pull_request_target -> shell interpolation -> package authority shape.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Cordyceps command injection sink
        run: 'echo "simulated npm publish for ${{ github.event.pull_request.title }} with token ${{ secrets.REACHABLE_FIXTURE_TOKEN }}"'

  cordyceps-code-injection:
    # Scanner fixture only. Keep disabled while preserving untrusted PR text
    # flowing into an interpreted automation script.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const fixturePayload = `${{ github.event.pull_request.body }}`;
            eval(fixturePayload);

  cordyceps-broken-authorization:
    # Scanner fixture only. Keep disabled while preserving a privileged
    # pull_request_target job that trusts fork-controlled source.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Cordyceps privileged write sink
        env:
          GH_TOKEN: ${{ secrets.REACHABLE_FIXTURE_TOKEN }}
        run: gh api repos/${{ github.repository }}/contents/docs/cordyceps-fixture --method PUT

  cordyceps-artifact-seed:
    # Scanner fixture only. Keep disabled while preserving the low-trust
    # artifact producer used by the cross-workflow privilege-escalation shape.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v4
        with:
          name: reachable-cordyceps-fixture
          path: docs/

  cordyceps-cross-workflow-privilege-escalation:
    # Scanner fixture only. Keep disabled while preserving the artifact-to-
    # release-authority shape used by workflow-security.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reachable-cordyceps-fixture
      - name: Cordyceps release authority sink
        run: |
          echo "simulated gh release create reachable-cordyceps-fixture docs/*"
